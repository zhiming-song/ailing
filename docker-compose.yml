services:
  ailing-mysql:
    image: mysql:8.4
    container_name: ailing-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ailing_analytics}
      MYSQL_USER: ${MYSQL_USER:-ailing}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - ailing-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - analytics-internal

  ailing-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ailing-api
    restart: unless-stopped
    environment:
      DB_HOST: ailing-mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-ailing_analytics}
      DB_USER: ${MYSQL_USER:-ailing}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      ANALYTICS_ADMIN_USER: ${ANALYTICS_ADMIN_USER:?ANALYTICS_ADMIN_USER is required}
      ANALYTICS_ADMIN_PASSWORD: ${ANALYTICS_ADMIN_PASSWORD:?ANALYTICS_ADMIN_PASSWORD is required}
      TZ: Asia/Shanghai
    depends_on:
      ailing-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - analytics-internal

  ailing-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ailing-frontend
    restart: unless-stopped
    depends_on:
      ailing-api:
        condition: service_healthy
    networks:
      - gateway
      - analytics-internal

volumes:
  ailing-mysql-data:

networks:
  gateway:
    external: true
    name: gateway
  analytics-internal:
    internal: true
